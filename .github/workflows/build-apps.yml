name: Build VoiceForge apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: voiceforge-windows
          path: frontend/dist-electron/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and build APK
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: voiceforge-android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish latest installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create latest --repo "${GITHUB_REPOSITORY}" --title "VoiceForge AI latest builds" --notes "Latest automatically built Windows and Android installers. iPhone and iPad users can install the web app from Safari using Share → Add to Home Screen."
          gh release upload latest release-assets/voiceforge-windows/*.exe release-assets/voiceforge-android/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
